name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run as well: new vulnerabilities are published while the code stays the same.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: make audit

  test:
    name: Lint and tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: documents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Run tests (fails below the coverage threshold in pyproject.toml)
        run: uv run pytest -v --cov --cov-report=term-missing
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://app:app@localhost:5432/documents_test' || '' }}

  e2e:
    name: End-to-end (docker compose)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: docker compose up -d --build --wait
      - run: uv run pytest -m e2e -v
        env:
          E2E_BASE_URL: http://localhost:8000
          E2E_API_KEY: dev-key
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
