# Weekly update PRs for dependencies. CI (tests, mypy, pip-audit) checks each PR, so an
# update that breaks something stays visible and is not merged by accident.
# Minor and patch updates are grouped into one PR per ecosystem to limit the noise.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
